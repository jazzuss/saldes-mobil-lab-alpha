  name: saldes-churn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jasmin-shahbedaghloo.89-167-53-206.sslip.io]
