apiVersion: apps/v1
kind: Deployment

metadata:
  name: saldes-model

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: saldes-model

  template:
    metadata:
      labels:
        app: saldes-model

    spec:
      containers:
        - name: saldes-model
          image: ghcr.io/norelindkvist-debug/saldes-mobil-kubernetes:fbb231c78f21e0a10235052c83828e73da57925b

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
