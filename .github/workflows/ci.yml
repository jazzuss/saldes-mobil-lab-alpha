name: CI

on:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "kontroller/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "Dockerfile"
      - ".dockerignore"

  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "kontroller/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "Dockerfile"
      - ".dockerignore"

  workflow_dispatch:
    inputs:
      datafil:
        description: "Vilken datafil ska kontrolleras?"
        default: "data/kundbas.csv"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    name: test different python versions
    strategy:
      fail-fast: false

      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/installera
        with:
          python-version: ${{ matrix.python-version }}
          extras: "dev,data"

      - run: pytest tests/test_data.py tests/test_features.py tests/test_model.py

  datakontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/installera
        with:
          extras: "data"

      - run: python kontroller/schema.py ${{ inputs.datafil || 'data/kundbas.csv' }}

  train:
    runs-on: ubuntu-latest
    needs: [test, datakontroll]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/installera

      - run: python -m churn.model

      - name: Ladda upp kandidatmodell och mätvärden
        uses: actions/upload-artifact@v4
        with:
          name: kandidat-${{ github.sha }}
          path: outputs/
          if-no-files-found: error
          retention-days: 1

  utvardera:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/installera
        with:
          extras: "dev"

      - name: Ladda ner kandidatmodell och mätvärden
        uses: actions/download-artifact@v4
        with:
          name: kandidat-${{ github.sha }}
          path: outputs/

      - run: python -m churn.evaluate

      - name: Testa ROC AUC med pytest
        if: success() || failure()
        run: python -m pytest tests/test_check_ROC_AUC_values.py
        
      - name: Ladda upp godkänd modell
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

      # AI genererat

      - name: Visa mätvärden i Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          fil = Path("outputs/matvarden.json")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Modellens mätvärden\n\n")

              if fil.exists():
                  matvarden = json.loads(fil.read_text())

                  f.write("| Mätvärde | Värde |\n")
                  f.write("|---|---|\n")

                  for nyckel, varde in matvarden.items():
                      f.write(f"| {nyckel} | {varde} |\n")
              else:
                  f.write("Mätvärdesfilen saknas.\n")
          PY

  ringlista:
    name: skapa ringlista
    runs-on: ubuntu-latest
    needs: utvardera

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/installera
      
      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: skapa ringlista
        run: python -m churn.score

      - name: Ladda upp ringlistan
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error

  docker:
    name: bygg och testa image
    runs-on: ubuntu-latest
    needs: utvardera

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Ladda ner godkänd modell
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - uses: docker/setup-buildx-action@v3

      - name: Bygg image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
        
      # AI genererat
      - name: Smoke-test
        run: |
          docker run -d --name churn -p 8000:8000 "$IMAGE"
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          svar=$(curl --fail -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"alder": 30, "region": "Stockholm", "abonnemang": "Bas", "manader_som_kund": 2, "manadskostnad": 149.0, "data_gb_per_manad": 5.0, "supportarenden_12m": 3}')
          echo "$svar"
          echo "$svar" | python3 -c 'import json, sys; r = json.load(sys.stdin)["risk"]; assert 0 <= r <= 1, r'

      - name: Visa containerns logg om smoke testet fallerar
        if: failure()
        run: docker logs churn

      - name: Logga in på ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pusha imagen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push "$IMAGE"