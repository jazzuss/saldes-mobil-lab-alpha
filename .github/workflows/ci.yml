name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      datafil:
        description: "Vilken datafil ska kontrolleras?"
        default: "data/kundbas.csv"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    name: test different python versions
    strategy:
      fail-fast: false

      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

          cache: "pip"

          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[data]"

      - run: pip install pytest

      - run: pytest tests/test_data.py tests/test_features.py tests/test_model.py

  datakontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7

        with:
          python-version: "3.11"

          cache: "pip"

          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[data]"

      - run: python kontroller/schema.py ${{ inputs.datafil || 'data/kundbas.csv' }}

  train:
    runs-on: ubuntu-latest
    needs: [test, datakontroll]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

          cache: "pip"

          cache-dependency-path: "pyproject.toml"

      - run: pip install -e .

      - run: python -m churn.model

      - name: Ladda upp modell och mätvärden
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e .

      - run: pip install pytest

      - name: Ladda ner modell och mätvärden
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: python -m churn.evaluate

      - name: Testa ROC AUC med pytest
        if: success() || failure()
        run: python -m pytest tests/test_check_ROC_AUC_values.py

      # AI genererat

      - name: Visa mätvärden i Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          fil = Path("outputs/matvarden.json")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Modellens mätvärden\n\n")

              if fil.exists():
                  matvarden = json.loads(fil.read_text())

                  f.write("| Mätvärde | Värde |\n")
                  f.write("|---|---|\n")

                  for nyckel, varde in matvarden.items():
                      f.write(f"| {nyckel} | {varde} |\n")
              else:
                  f.write("Mätvärdesfilen saknas.\n")
          PY
