name: CI

on:
  push:
  pull_request:

jobs:
  allt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e .

      - run: pip install pytest

      - run: pytest tests/test_data.py tests/test_features.py tests/test_model.py

      - run: python -m churn.model tests/test_se_om_matvarden_finns.py
